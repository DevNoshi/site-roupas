<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - The Clothing Noshi</title>
  <link rel="icon" href="imagens-atualizadas/perfil-noshi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("noshi-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="wrap bar">
      <a class="logo" href="index.html">The Clothing Noshi</a>
      <div class="actions">
        <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Tema escuro"><span class="stars"></span><span class="knob"></span></button>
        <a class="cart-open" href="index.html">Continuar comprando</a>
      </div>
    </div>
  </header>

  <main class="wrap checkout">
    <section>
      <h1>Seu carrinho</h1>
      <div class="cart-list"></div>
      <p class="sum"><span>Total</span><strong class="cart-total" id="total-price">R$ 0,00</strong></p>
    </section>

    <section>
      <h2>Seus dados</h2>
      <form id="checkout-form" class="form" novalidate>
        <label>Nome completo<input id="name" name="name" autocomplete="name" required /></label>
        <label>E-mail<input id="email" name="email" type="email" autocomplete="email" required /></label>
        <label>Telefone<input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="(11) 99999-9999" autocomplete="tel" required /></label>
        <label>CEP<input id="cep" name="cep" inputmode="numeric" placeholder="00000-000" autocomplete="postal-code" required /></label>
        <label>Endereço<textarea id="address" name="address" rows="3" placeholder="Rua, número, complemento, bairro, cidade" required></textarea></label>
        <p class="hint" id="cep-hint"></p>
        <button type="submit" class="btn" id="checkout-btn" disabled>Finalizar compra</button>
        <button type="button" class="btn ghost" id="whatsapp-btn" disabled>Enviar pedido pelo WhatsApp</button>
      </form>
      <div class="done" id="done" hidden>
        <h2>Pedido recebido</h2>
        <p>Obrigado! Vamos entrar em contato para confirmar pagamento e entrega.</p>
        <a class="btn" href="index.html">Voltar à loja</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap foot">
      <div>
        <h3>Contato</h3>
        <p><a href="mailto:contato@theclothingnoshi.com">contato@theclothingnoshi.com</a></p>
      </div>
    </div>
    <p class="copy">&copy; 2026 The Clothing Noshi. Todos os direitos reservados.</p>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="js/cart.js"></script>
</body>
</html>
