<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Clothing Noshi</title>
  <meta name="description" content="Moda masculina com qualidade, estilo e conforto." />
  <link rel="icon" href="imagens-atualizadas/perfil-noshi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("noshi-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="wrap bar">
      <a class="logo" href="index.html">The Clothing Noshi</a>
      <div class="actions">
        <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Tema escuro"><span class="stars"></span><span class="knob"></span></button>
        <button class="cart-open" id="cart-open" aria-label="Abrir carrinho">
        Carrinho <span id="cart-count" class="count">0</span>
      </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <img src="imagens-atualizadas/perfil3.png" alt="Coleção The Clothing Noshi" />
  </section>

  <main class="wrap">
    <div class="tools">
      <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
      <div class="filters">
        <input type="search" id="search" placeholder="Buscar peça" aria-label="Buscar peça" />
        <select id="sort" aria-label="Ordenar">
          <option value="">Ordenar</option>
          <option value="asc">Menor preço</option>
          <option value="desc">Maior preço</option>
          <option value="az">Nome A–Z</option>
        </select>
      </div>
    </div>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="wrap foot">
      <div>
        <h3>The Clothing Noshi</h3>
        <p>Moda masculina com qualidade, estilo e conforto.</p>
      </div>
      <div>
        <h3>Contato</h3>
        <p><a href="mailto:contato@theclothingnoshi.com">contato@theclothingnoshi.com</a></p>
        <p><a href="https://wa.me/5511999999999" target="_blank" rel="noopener">WhatsApp</a> ·
           <a href="https://www.instagram.com/seuusuario" target="_blank" rel="noopener">Instagram</a></p>
      </div>
    </div>
    <p class="copy">&copy; 2026 The Clothing Noshi. Todos os direitos reservados.</p>
  </footer>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Carrinho" aria-hidden="true">
    <div class="drawer-head">
      <h2>Seu carrinho</h2>
      <button id="cart-close" aria-label="Fechar carrinho">✕</button>
    </div>
    <div class="cart-list"></div>
    <div class="drawer-foot">
      <p class="sum"><span>Subtotal</span><strong class="cart-total">R$ 0,00</strong></p>
      <a class="btn" id="go-checkout" href="checkout.html">Ir para o checkout</a>
    </div>
  </aside>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/cart.js"></script>
</body>
</html>
